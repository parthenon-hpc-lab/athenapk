# This file was made in part with generative AI
name: Check Formatting

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-formatting:
    # Preserve the existing required-check name.
    name: Check Python and C++ Formatting
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/parthenon-hpc-lab/cuda12.9-mpi-hdf5-opmd

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install formatting tools
        run: python -m pip install --requirement requirements-format.txt

      - name: Check formatting
        shell: bash
        run: |
          ./scripts/format.sh

          if ! git diff --exit-code; then
            echo "::error::Formatting changes are required."
            echo "::error::Run './scripts/format.sh' and commit the result."
            exit 1
          fi
