# This file was made in part with generative AI
name: Check Formatting

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-formatting:
    # Preserve the existing required-check name.
    name: Check Python and C++ Formatting
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-format.txt

      - name: Install formatting tools
        run: python -m pip install --requirement requirements-format.txt

      - name: Check formatting
        shell: bash
        run: |
          ./scripts/format.sh

          if ! git diff --exit-code; then
            echo "::error::Formatting changes are required."
            echo "::error::Run './scripts/format.sh' and commit the result."
            exit 1
          fi
