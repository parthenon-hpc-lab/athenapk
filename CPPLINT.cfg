# This file was made in part with generative AI
# AthenaPK C++ lint policy, based on Parthenon's configuration.
# Don't search for additional CPPLINT.cfg in parent directories.
set noparent
headers=hpp
linelength=90
# Don't use 'SRC_' as the cpp header guard prefix
root=./src/
extensions=hpp,cpp

# Match Parthenon's lint policy for Kokkos code. clang-format owns spacing.
filter=-readability/fn_size
filter=-runtime/references
filter=-whitespace/comma
filter=-whitespace/comments
filter=-whitespace/operators
filter=-whitespace/parens
filter=-build/namespaces

# AthenaPK uses both relative includes and Parthenon umbrella headers, with
# separate include groups for dependencies and local code.
filter=-build/include,-build/include_subdir,-build/include_order
filter=-build/include_what_you_use
# Existing guards use both SRC_ prefixes and paths relative to src/.
filter=-build/header_guard
# clang-format preserves blank lines and determines namespace indentation.
filter=-whitespace/blank_line,-whitespace/indent_namespace
# Anonymous TODOs and implicit constructors are existing project conventions.
filter=-readability/todo,-whitespace/todo,-runtime/explicit
